name: Publish research dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: valuation-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quote source
        run: pip install -r requirements.txt
      - name: Refresh latest closed A/H prices from Markdown universe
        run: python scripts/update_market_quotes.py
      - name: Persist valid market quote changes
        run: |
          if ! git diff --quiet -- data/market_quotes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/market_quotes.json
            git commit -m 'data: update latest verified A/H closing prices'
            git push
          else
            echo 'No newer validated market close available.'
          fi
      - name: Validate research data
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/verify_site_quotes.py
      - name: Validate Markdown website
        run: |
          node --check assets/research.js
          node tests/smoke_research.js
      - name: Build public site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts may take several seconds to appear in the Actions API.
          # deploy-pages fails with 'Found 0 artifact(s)' if called too early.
          for attempt in $(seq 1 24); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null | head -n 1 || true)"
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact registered: $artifact_id"
              sleep 5
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/24)"
            sleep 5
          done
          echo '::error::Pages artifact was uploaded but not indexed by GitHub Actions API.'
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages serves published closing quotes
        run: python scripts/verify_site_quotes.py
