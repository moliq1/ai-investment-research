name: Publish research dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: valuation-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quote source
        run: pip install -r requirements.txt
      - name: Refresh latest closed A/H prices from Markdown universe
        run: python scripts/update_market_quotes.py
      - name: Persist valid market quote changes
        run: |
          if ! git diff --quiet -- data/market_quotes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/market_quotes.json
            git commit -m 'data: update latest verified A/H closing prices'
            git push
          else
            echo 'No newer validated market close available.'
          fi
      - name: Validate research data
        run: python -m unittest discover -s tests -v
      - name: Validate Markdown website
        run: |
          node --check assets/research.js
          node tests/smoke_research.js
      - name: Build public site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
