name: Refresh Markdown valuation-universe quotes and publish site

on:
  schedule:
    # GitHub's schedule uses UTC. China Standard Time = UTC+8.
    # Run after both A-share and Hong Kong closing sessions.
    - cron: '30 10 * * 1-5' # Beijing 18:30 (primary)
    - cron: '30 13 * * 1-5' # Beijing 21:30 (retry in case quotes lag)
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: valuation-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quote source
        run: pip install -r requirements.txt
      - name: Refresh valid daily closing prices
        run: python scripts/update_market_quotes.py
      - name: Validate research data
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/verify_site_quotes.py
      - name: Commit fresh quote snapshots
        run: |
          if ! git diff --quiet -- data/market_quotes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/market_quotes.json
            git commit -m 'data: refresh latest A/H closing prices'
            git push
          else
            echo 'No newer valid daily close.'
          fi
      # Quote snapshots are the only external market input; research models remain in Markdown.
      - name: Validate Markdown website
        run: |
          node --check assets/research.js
          node tests/smoke_research.js
      # IMPORTANT: commits pushed by GITHUB_TOKEN do NOT trigger a second
      # push-based workflow. Deploy in this same workflow so the website
      # actually shows the updated market_quotes.json after every refresh.
      - name: Build Markdown website with the updated dated close snapshots
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts may take several seconds to appear in the Actions API.
          # deploy-pages fails with 'Found 0 artifact(s)' if called too early.
          for attempt in $(seq 1 24); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null | head -n 1 || true)"
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact registered: $artifact_id"
              sleep 5
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/24)"
            sleep 5
          done
          echo '::error::Pages artifact was uploaded but not indexed by GitHub Actions API.'
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages serves published closing quotes
        run: python scripts/verify_site_quotes.py
