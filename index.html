<title>Alpha Atlas · AI 投研工作台</title>
<script>
/* Apply the preferred palette before CSS loads to avoid a light-mode flash. */
(function(){
  'use strict';
  const KEY='alpha-atlas-theme';
  const choices=['system','light','dark'];
  const media=typeof window.matchMedia==='function'?window.matchMedia('(prefers-color-scheme: dark)'):null;
  let mode='system';
  try{const saved=window.localStorage.getItem(KEY);if(choices.includes(saved))mode=saved}catch(_){}
  function applyTheme(){
    const effective=mode==='system'?(media&&media.matches?'dark':'light'):mode;
    const root=document.documentElement;
    root.dataset.theme=effective;
    root.dataset.themeMode=mode;
    root.style.colorScheme=effective;
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',effective==='dark'?'#0d1524':'#f5f7fa');
    const select=document.getElementById('theme-mode');
    if(select)select.value=mode;
  }
  applyTheme();
  const onSystemChange=()=>{if(mode==='system')applyTheme()};
  if(media){
    if(typeof media.addEventListener==='function')media.addEventListener('change',onSystemChange);
    else if(typeof media.addListener==='function')media.addListener(onSystemChange);
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const select=document.getElementById('theme-mode');
    if(!select)return;
    select.value=mode;
    select.addEventListener('change',()=>{
      mode=choices.includes(select.value)?select.value:'system';
      try{window.localStorage.setItem(KEY,mode)}catch(_){}
      applyTheme();
    });
  });
  window.AtlasTheme={getMode:()=>mode,getEffective:()=>document.documentElement.dataset.theme};
})();
</script>
<link rel="stylesheet" href="assets/research.css">
<script src="assets/research.js" defer></script>
